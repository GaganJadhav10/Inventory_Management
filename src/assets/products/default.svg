<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Box body -->
  <rect x="120" y="90" width="160" height="120" rx="8" fill="#1e293b"/>
  <rect x="125" y="95" width="150" height="110" rx="6" fill="#334155"/>
  <!-- Box lid -->
  <path d="M110 95 L200 65 L290 95 L200 125 Z" fill="#475569"/>
  <path d="M115 95 L200 68 L285 95 L200 122 Z" fill="#64748b"/>
  <!-- Ribbon vertical -->
  <rect x="195" y="65" width="10" height="145" fill="#6366f1" opacity="0.6"/>
  <!-- Ribbon horizontal -->
  <rect x="120" y="140" width="160" height="10" fill="#6366f1" opacity="0.6"/>
  <!-- Bow -->
  <ellipse cx="185" cy="75" rx="15" ry="10" fill="#8b5cf6" opacity="0.7" transform="rotate(-20 185 75)"/>
  <ellipse cx="215" cy="75" rx="15" ry="10" fill="#8b5cf6" opacity="0.7" transform="rotate(20 215 75)"/>
  <circle cx="200" cy="78" r="5" fill="#6366f1"/>
  <!-- Question mark -->
  <text x="200" y="175" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="bold" fill="#f8fafc" opacity="0.4">?</text>
</svg>
