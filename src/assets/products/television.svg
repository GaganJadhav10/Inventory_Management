<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="tvScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- TV Screen -->
  <rect x="55" y="45" width="290" height="170" rx="8" fill="#1e293b"/>
  <rect x="62" y="52" width="276" height="156" rx="4" fill="url(#tvScreen)"/>
  <!-- Screen content -->
  <rect x="82" y="72" width="100" height="8" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <rect x="82" y="90" width="160" height="4" rx="2" fill="#94a3b8" opacity="0.3"/>
  <rect x="82" y="100" width="140" height="4" rx="2" fill="#94a3b8" opacity="0.25"/>
  <rect x="82" y="120" width="220" height="80" rx="6" fill="#6366f1" opacity="0.15"/>
  <polygon points="170,145 170,175 195,160" fill="#8b5cf6" opacity="0.5"/>
  <!-- Stand -->
  <rect x="175" y="215" width="50" height="8" rx="2" fill="#475569"/>
  <rect x="155" y="223" width="90" height="6" rx="3" fill="#64748b"/>
  <!-- Brand dot -->
  <circle cx="200" cy="210" r="2" fill="#475569"/>
</svg>
