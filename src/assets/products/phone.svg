<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b" />
      <stop offset="100%" style="stop-color:#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Phone body -->
  <rect x="150" y="25" width="100" height="200" rx="16" fill="url(#phoneBody)"/>
  <rect x="156" y="40" width="88" height="165" rx="8" fill="#1e3a5f"/>
  <!-- Screen content -->
  <circle cx="200" cy="75" r="12" fill="#3b82f6" opacity="0.6"/>
  <rect x="175" y="98" width="50" height="5" rx="2.5" fill="#60a5fa" opacity="0.6"/>
  <rect x="180" y="110" width="40" height="3" rx="1.5" fill="#94a3b8" opacity="0.4"/>
  <rect x="170" y="128" width="60" height="18" rx="4" fill="#3b82f6" opacity="0.5"/>
  <rect x="170" y="152" width="60" height="18" rx="4" fill="#6366f1" opacity="0.4"/>
  <rect x="170" y="176" width="60" height="18" rx="4" fill="#8b5cf6" opacity="0.3"/>
  <!-- Notch -->
  <rect x="185" y="29" width="30" height="6" rx="3" fill="#334155"/>
  <!-- Home indicator -->
  <rect x="185" y="215" width="30" height="3" rx="1.5" fill="#475569"/>
