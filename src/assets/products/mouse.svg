<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569" />
      <stop offset="100%" style="stop-color:#334155" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Mouse body -->
  <ellipse cx="200" cy="155" rx="60" ry="80" fill="url(#mouseBody)"/>
  <!-- Mouse top highlight -->
  <ellipse cx="200" cy="130" rx="50" ry="40" fill="#475569" opacity="0.3"/>
  <!-- Scroll wheel -->
  <rect x="194" y="108" width="12" height="22" rx="6" fill="#1e293b"/>
  <rect x="197" y="112" width="6" height="14" rx="3" fill="#64748b"/>
  <!-- Divider line -->
  <line x1="200" y1="95" x2="200" y2="135" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Side buttons -->
  <rect x="138" y="130" width="4" height="16" rx="2" fill="#1e293b" opacity="0.5"/>
  <rect x="138" y="150" width="4" height="16" rx="2" fill="#1e293b" opacity="0.5"/>
  <!-- LED accent -->
  <ellipse cx="200" cy="220" rx="20" ry="3" fill="#14b8a6" opacity="0.3"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="240" rx="55" ry="8" fill="#0f172a" opacity="0.15"/>
</svg>
