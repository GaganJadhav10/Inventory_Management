<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b" />
      <stop offset="100%" style="stop-color:#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Camera body -->
  <rect x="120" y="85" width="160" height="110" rx="12" fill="#1e293b"/>
  <rect x="125" y="90" width="150" height="100" rx="10" fill="#334155"/>
  <!-- Lens mount -->
  <circle cx="200" cy="140" r="42" fill="#1e293b"/>
  <circle cx="200" cy="140" r="38" fill="#0f172a"/>
  <circle cx="200" cy="140" r="32" fill="url(#lens)"/>
  <circle cx="200" cy="140" r="26" fill="#1e3a5f" opacity="0.6"/>
  <circle cx="200" cy="140" r="18" fill="#0f172a"/>
  <circle cx="200" cy="140" r="12" fill="#1e3a5f" opacity="0.4"/>
  <!-- Lens reflection -->
  <circle cx="192" cy="132" r="4" fill="#f8fafc" opacity="0.3"/>
  <!-- Viewfinder -->
  <rect x="240" y="90" width="30" height="20" rx="4" fill="#1e293b"/>
  <rect x="244" y="94" width="22" height="12" rx="2" fill="#0f172a"/>
  <!-- Flash -->
  <rect x="130" y="90" width="25" height="15" rx="3" fill="#475569"/>
  <!-- Grip -->
  <rect x="120" y="95" width="15" height="90" rx="4" fill="#1e293b"/>
  <!-- Shutter button -->
  <circle cx="260" cy="80" r="8" fill="#475569"/>
  <circle cx="260" cy="80" r="5" fill="#64748b"/>
  <!-- Mode dial -->
  <circle cx="230" cy="80" r="6" fill="#475569"/>
</svg>
