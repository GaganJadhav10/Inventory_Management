<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155" />
      <stop offset="100%" style="stop-color:#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="16"/>
  <!-- Band top -->
  <rect x="180" y="30" width="40" height="80" rx="4" fill="url(#band)"/>
  <!-- Watch face -->
  <circle cx="200" cy="155" r="55" fill="#1e293b"/>
  <circle cx="200" cy="155" r="50" fill="#0f172a"/>
  <circle cx="200" cy="155" r="47" fill="#1e3a5f" opacity="0.5"/>
  <!-- Watch screen content -->
  <text x="200" y="148" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#f8fafc">12:45</text>
  <text x="200" y="168" text-anchor="middle" font-family="system-ui" font-size="9" fill="#94a3b8">MON, JUL 25</text>
  <!-- Crown -->
  <rect x="253" y="148" width="8" height="14" rx="3" fill="#475569"/>
  <!-- Band bottom -->
  <rect x="180" y="195" width="40" height="80" rx="4" fill="url(#band)"/>
  <!-- Band holes -->
  <circle cx="200" cy="215" r="2" fill="#475569"/>
  <circle cx="200" cy="225" r="2" fill="#475569"/>
  <circle cx="200" cy="235" r="2" fill="#475569"/>
  <circle cx="200" cy="245" r="2" fill="#475569"/>
</svg>
